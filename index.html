<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IN PHIẾU KHO - Bằng máy in decal size 100mm</title>
<style>
  :root{ --paper-width:100mm; --font:"Inter","Segoe UI",Tahoma,Arial,sans-serif; --fs:11pt; --line:1.35;
         --bg:#e9eef6; --card:#eef3fb; --ink:#121826; --muted:#6b7280; --brand:#2a6dff;
         --shadow1:rgba(163,177,198,.6); --shadow2:rgba(255,255,255,1); --inset1:rgba(163,177,198,.45);
         --inset2:rgba(255,255,255,.95); --border:#cfd7e6; }
  *{box-sizing:border-box} body{margin:0;font-family:var(--font);font-size:var(--fs);line-height:var(--line);
    color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%, #f5f8ff 0%, var(--bg) 50%);}
  .topbar{position:sticky;top:0;z-index:10;background:transparent}
  .topbar-inner{width:min(1100px,96vw);margin:14px auto 4px auto;padding:10px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .brand{grid-column:2;display:flex;align-items:center;gap:12px;justify-content:center;font-weight:900;letter-spacing:.3px;padding:10px 16px;border-radius:18px;background:var(--card);
         box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2)}
  .brand svg{width:28px;height:28px}.brand-title{font-size:15px}
  .top-actions{grid-column:3;justify-self:end;display:flex;gap:10px}
  .ghost{background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
         box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2);transition:transform .06s ease,box-shadow .2s ease,border-color .2s ease}
  .ghost svg{width:18px;height:18px}.ghost:hover{border-color:#b8c2d8}.ghost:active{transform:translateY(1px);
         box-shadow:inset 6px 6px 12px var(--inset1),inset -6px -6px 12px var(--inset2)}
  .wrap{width:min(1100px,96vw);margin:10px auto 24px auto;display:flex;gap:16px;align-items:flex-start;justify-content:center}
  .controls,.sheet{background:var(--card);border-radius:18px;border:1px solid var(--border);box-shadow:12px 12px 26px var(--shadow1),-12px -12px 26px var(--shadow2)}
  .controls{flex:1 1 520px;max-width:600px;padding:16px 16px 14px 16px}
  .controls h2{margin:0 0 10px 0;font-size:16px}.subtle{color:var(--muted);font-size:12px}
  .row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px} label{font-size:12px;color:#334155;display:block;margin:2px 0 4px}
  input[type="text"],input[type="date"],select,textarea{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--border);outline:none;background:var(--card);
    box-shadow:inset 6px 6px 14px var(--inset1),inset -6px -6px 14px var(--inset2);transition:box-shadow .15s,border-color .15s,background .15s}
  input:focus,select:focus,textarea:focus{border-color:#a8b6d2;box-shadow:inset 6px 6px 14px rgba(163,177,198,.55),inset -6px -6px 14px rgba(255,255,255,.98),0 0 0 4px rgba(42,109,255,.12)}
  textarea{min-height:170px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;cursor:pointer;font-weight:700;background:linear-gradient(180deg,#3c82ff,var(--brand));color:white;border:1px solid #2b5ee0;
       box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2);transition:transform .06s ease,box-shadow .25s ease}
  .btn svg{width:18px;height:18px;flex:0 0 18px}.btn:active{transform:translateY(1px);box-shadow:inset 6px 6px 12px rgba(0,0,0,.12),inset -6px -6px 12px rgba(255,255,255,.35)}
  .btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--border)}
  .preview{flex:0 0 auto}.sheet{width:var(--paper-width);padding:6mm 4mm;background:white}
  .hdr{text-align:center;margin-bottom:6px}.hdr .title{font-weight:900;font-size:13.5pt;letter-spacing:.3px}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 8px;font-size:10.5pt}.meta .label{color:#475569}.meta strong{margin-left:6px}
  table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #1f2937}
  th,td{border:1px solid #1f2937;padding:4px 6px;vertical-align:middle;word-wrap:break-word} th{font-weight:800;text-align:center;background:#f5f7fb} td.center{text-align:center}
  colgroup col.col-stt{width:10%} colgroup col.col-ten{width:50%} colgroup col.col-ma{width:15%} colgroup col.col-dvt{width:10%} colgroup col.col-sl{width:15%}
  tbody tr:nth-child(odd){background:#fbfcff} tbody tr:hover{background:#eef2ff} .footer-note{margin-top:10px;font-size:11px;color:var(--muted);text-align:center}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:all .25s ease;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;z-index:9999}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:900px){.wrap{flex-direction:column;align-items:center}.controls{width:100%;max-width:720px}.preview{order:2}}
  @media print{.topbar,.controls,.footer-note,#toast{display:none!important}.sheet{border:none;margin:0 auto;width:var(--paper-width);padding:4mm;box-shadow:none;background:white}
           @page{size:100mm auto;margin:4mm}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div></div>
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="3" stroke="#121826" stroke-width="1.5"/>
          <path d="M4 9h16M8 13h4M8 17h8" stroke="#121826" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="brand-title">CÔNG CỤ IN PHIẾU KHO BẰNG MÁY IN DECAL</div>
      </div>
      <div class="top-actions">
        <button class="ghost" title="In nhanh (Ctrl/Cmd+P)" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9V4h12v5M6 14H4a2 2 0 0 1-2-2v-1a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1a2 2 0 0 1-2 2h-2" stroke="#121826" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M7 14h10v6H7z" stroke="#121826" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span>In nhanh</span>
        </button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="controls">
      <h2>Nhập dữ liệu & cấu hình</h2>
      <div class="row">
        <div>
          <label>Loại phiếu</label>
          <div style="display:flex; gap:14px; align-items:center">
            <label style="display:flex; gap:6px; align-items:center">
              <input type="radio" name="loaiphieu" value="PHIẾU NHẬP KHO" checked> Nhập kho
            </label>
            <label style="display:flex; gap:6px; align-items:center">
              <input type="radio" name="loaiphieu" value="PHIẾU XUẤT KHO"> Xuất kho
            </label>
          </div>
        </div>
        <div>
          <label>Ngày <span class="subtle">(hiển thị dd/mm/yyyy)</span></label>
          <input type="date" id="ngay" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>Số phiếu</label>
          <input type="text" id="sophieu" placeholder="VD: NK-00123" />
        </div>
        <div>
          <label>Dấu tách cột (khi dán từ Excel)</label>
          <select id="delimiter">
            <option value="auto" selected>Tự động (khuyên dùng)</option>
            <option value="tab">Tab</option>
            <option value="semicolon">Dấu chấm phẩy ;</option>
            <option value="comma">Dấu phẩy ,</option>
            <option value="spaces">Khoảng trắng ≥ 2</option>
          </select>
        </div>
      </div>
      <label>Dán dữ liệu từ Excel (5 cột: STT, Tên, Mã, ĐVT, Số lượng)</label>
      <textarea id="raw" placeholder="Dán ở đây…"></textarea>
      <div class="btns">
        <button id="btnParse" class="btn">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="16" rx="2" ry="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 10h18M9 4v16M15 4v16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Tạo bảng
        </button>
        <button class="btn secondary" id="btnClear">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M9 7l1-2h4l1 2M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Xóa bảng
        </button>
        <button class="btn" id="btnPNG">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          Lưu PNG
        </button>
      </div>
      <p class="subtle" style="margin-top:8px">Gợi ý: có thể sửa trực tiếp ô trong bảng trước khi lưu ảnh.</p>
    </div>

    <div class="preview">
      <div class="sheet" id="sheet">
        <div class="hdr">
          <div class="title" id="t-loaiphieu">PHIẾU NHẬP KHO</div>
        </div>
        <div class="meta">
          <div class="l"><span class="label">Ngày:</span><strong id="t-ngay"></strong></div>
          <div class="r"><span class="label">Số phiếu:</span><strong id="t-sophieu"></strong></div>
        </div>
        <table>
          <colgroup>
            <col class="col-stt"><col class="col-ten"><col class="col-ma"><col class="col-dvt"><col class="col-sl">
          </colgroup>
          <thead><tr><th>STT</th><th>Tên hàng</th><th>Mã</th><th>ĐVT</th><th>SL</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="footer-note">© <span id="year"></span> – Công cụ in phiếu kho (Soft UI, chạy offline)</div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
function pickDelimiterAuto(text){
  const samples=text.trim().split(/\r?\n/).slice(0,20), SEP={tab:/\t/,semicolon:/;/,comma:/,/,spaces:/\s{2,}/};
  let best='tab',score=-1; for(const [name,rx] of Object.entries(SEP)){let s=0; for(const line of samples){const parts=line.split(rx).filter(x=>x.trim()!==''); if(parts.length>=4)s+=parts.length;} if(s>score){score=s;best=name;}}
  return best;
}
function splitLine(line,mode){let p; if(mode==='tab')p=line.split(/\t/); else if(mode==='semicolon')p=line.split(/;/); else if(mode==='comma')p=line.split(/,/); else if(mode==='spaces')p=line.split(/\s{2,}/); else p=line.split(/\t/); return p.map(s=>s.trim()).filter(Boolean);}
function looksLikeHeaderRow(parts){const j=parts.join(' ').toUpperCase(); if(/^(A\s+B\s+C\s+D(\s+1)?)$/.test(j))return true; if(parts.length<=2&&['A','B','C','D','1','STT'].includes(j))return true; return false;}
function cleanQuantity(v){const t=(v||'').trim(); if(t==='')return''; if(/^(\d+)\.000$/.test(t))return t.replace(/^(\d+)\.000$/,'$1'); if(/^\d{1,3}(\.\d{3})+$/.test(t))return t.replace(/\./g,''); if(/^\d{1,3}(,\d{3})+$/.test(t))return t.replace(/,/g,''); return t;}
function parseRaw(){
  const raw=document.getElementById('raw').value; if(!raw.trim()){alert('Hãy dán dữ liệu trước.'); return[];}
  let mode=document.getElementById('delimiter').value; if(mode==='auto')mode=pickDelimiterAuto(raw);
  const lines=raw.split(/\r?\n/), rows=[]; for(const line of lines){const parts=splitLine(line,mode); if(parts.length===0)continue; if(looksLikeHeaderRow(parts))continue; rows.push(parts);}
  const out=[]; let sttCounter=1; for(const tokens of rows){const nonEmpty=tokens.filter(t=>t.trim()!==''); if(nonEmpty.length<2)continue;
    let stt=/^\d+$/.test(nonEmpty[0])?nonEmpty.shift():(sttCounter).toString(); let ten=nonEmpty.shift()||''; let ma=nonEmpty.shift()||''; let dvt=nonEmpty.shift()||''; let sl=nonEmpty.shift()||'';
    if(sl==='' && /^\d{1,3}([.,]\d{3})*(\.\d+)?$/.test(dvt)){sl=dvt; dvt='';} sl=cleanQuantity(sl); out.push({stt,ten,ma,dvt,sl}); sttCounter++;}
  return out;
}
function renderTable(data){
  const tbody=document.getElementById('tbody'); tbody.innerHTML=''; data.forEach(row=>{
    const tr=document.createElement('tr'); tr.innerHTML=`
      <td class="center">${row.stt}</td>
      <td contenteditable="true">${row.ten}</td>
      <td contenteditable="true" class="center">${row.ma}</td>
      <td contenteditable="true" class="center">${row.dvt}</td>
      <td contenteditable="true" class="center">${row.sl}</td>`; tbody.appendChild(tr);
  });
}
function updateMeta(){
  const loaiphieu=document.querySelector('input[name="loaiphieu"]:checked').value;
  document.getElementById('t-loaiphieu').textContent=(loaiphieu||'').toUpperCase();
  const ngay=document.getElementById('ngay').value; if(ngay){const [y,m,d]=ngay.split('-'); document.getElementById('t-ngay').textContent=`${d}/${m}/${y}`;}
  document.getElementById('t-sophieu').textContent=document.getElementById('sophieu')?.value||'';
}
function mmToPx(mm, dpi=96){ return Math.round(mm * dpi / 25.4); }
function wrapText(ctx, text, maxWidth){
  const words=(text||'').split(/\s+/); const lines=[]; let line='';
  for(const w of words){ const test=line? line+' '+w : w; if(ctx.measureText(test).width <= maxWidth){ line=test; } else { if(line) lines.push(line); line=w; } }
  if(line) lines.push(line); return lines;
}
function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._timer); showToast._timer=setTimeout(()=>t.classList.remove('show'), 1600);
}
async function exportPNG(scale=3){
  const baseW=mmToPx(100,96), W=baseW*scale;
  const padLeft=10*scale, padRight=10*scale;
  const padTop=10*scale, padBottom=10*scale;
  const lineW=Math.max(1,Math.floor(scale));

  const title=document.getElementById('t-loaiphieu').textContent||'PHIẾU KHO';
  const ngay=document.getElementById('t-ngay').textContent||'';
  const sophieu=document.getElementById('t-sophieu').textContent||'';
  const rows=[]; document.querySelectorAll('#tbody tr').forEach(tr=>{const t=tr.querySelectorAll('td');
    rows.push([t[0]?.textContent.trim()||'', t[1]?.textContent.trim()||'', t[2]?.textContent.trim()||'', t[3]?.textContent.trim()||'', t[4]?.textContent.trim()||'']);});

  const Wdraw = W - padLeft - padRight;
  const colPerc=[.10,.50,.15,.10,.15];
  const colX=[padLeft]; for(let i=0;i<5;i++){ colX.push(colX[i] + Math.floor(Wdraw*colPerc[i])); }
  const tableLeft=padLeft, tableRight=padLeft + Wdraw, tableWidth=Wdraw;

  const headerH=18*scale, metaH=16*scale, gap=6*scale, thH=24*scale, rowPadY=6*scale, lineH=14*scale;

  const testCanvas=document.createElement('canvas'); const tctx=testCanvas.getContext('2d');
  tctx.font=`${12*scale}px Arial, sans-serif`;
  const maxTenWidth=colX[2]-colX[1]-8*scale;
  let y = padTop + headerH + gap + metaH + gap + thH;
  const rowHeights=[];
  rows.forEach(r=>{ const tenLines=wrapText(tctx,r[1],maxTenWidth); const n=Math.max(1,tenLines.length); const h=rowPadY*2+n*lineH; rowHeights.push(h); y+=h; });
  const H = Math.ceil(y + padBottom);

  const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H; const c=canvas.getContext('2d');
  c.fillStyle='#FFFFFF'; c.fillRect(0,0,W,H);
  c.strokeStyle='#000000'; c.lineWidth=lineW; c.fillStyle='#000000';
  c.save(); c.translate(0.5,0.5);

  c.font=`${14*scale}px Arial, sans-serif`; c.textAlign='center'; c.textBaseline='top'; c.fillText(title, W/2, padTop);
  c.font=`${12*scale}px Arial, sans-serif`; c.textAlign='left'; c.fillText(`Ngày: ${ngay}`, tableLeft, padTop + headerH + gap);
  c.textAlign='right'; c.fillText(`Số phiếu: ${sophieu}`, tableRight, padTop + headerH + gap);

  let ty = padTop + headerH + gap + metaH + gap;
  c.fillStyle='#f1f5f9'; c.fillRect(Math.floor(tableLeft), Math.floor(ty), Math.floor(tableWidth), Math.floor(thH));
  c.fillStyle='#000000'; c.textAlign='center'; c.textBaseline='middle';
  const ths=['STT','Tên hàng','Mã','ĐVT','SL'];
  for(let i=0;i<5;i++){ const x0=Math.floor(colX[i]), x1=Math.floor(colX[i+1]); c.strokeRect(x0, Math.floor(ty), x1-x0, Math.floor(thH)); c.fillText(ths[i], Math.floor((x0+x1)/2), Math.floor(ty + thH/2)); }
  ty += thH; c.textBaseline='top';
  rows.forEach((r,idx)=>{
    const rh=rowHeights[idx];
    for(let i=0;i<5;i++){ const x0=Math.floor(colX[i]), x1=Math.floor(colX[i+1]); c.strokeRect(x0, Math.floor(ty), x1-x0, Math.floor(rh)); }
    c.textAlign='center'; c.font=`${12*scale}px Arial, sans-serif`; c.fillText(r[0], Math.floor((colX[0]+colX[1])/2), Math.floor(ty + (rh - lineH)/2));
    c.textAlign='left'; const tenLines=wrapText(c, r[1], maxTenWidth); let yText = ty + rowPadY; tenLines.forEach(line=>{ c.fillText(line, Math.floor(colX[1]+4*scale), Math.floor(yText)); yText += lineH; });
    c.textAlign='center'; c.fillText(r[2], Math.floor((colX[2]+colX[3])/2), Math.floor(ty + (rh - lineH)/2));
    c.fillText(r[3], Math.floor((colX[3]+colX[4])/2), Math.floor(ty + (rh - lineH)/2));
    c.fillText(r[4], Math.floor((colX[4]+colX[5])/2), Math.floor(ty + (rh - lineH)/2));
    ty += rh;
  });
  c.restore();

  canvas.toBlob(async function(blob){
    if(!blob){ alert('Không thể xuất PNG.'); return; }
    const a=document.createElement('a'); const ts=new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
    a.download=`PhieuKho_${ts}.png`; a.href=URL.createObjectURL(blob); a.click();

    try{
      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({ "image/png": blob });
        await navigator.clipboard.write([item]);
        showToast("✅ Đã lưu & sao chép ảnh vào clipboard");
      } else {
        showToast("ℹ️ Đã lưu PNG (trình duyệt không hỗ trợ copy ảnh)");
      }
    }catch(err){
      console.warn("Clipboard write failed:", err);
      showToast("⚠️ Đã lưu PNG • Không thể copy ảnh (trình duyệt chặn)");
    }
  }, 'image/png');
}

document.addEventListener('DOMContentLoaded', function(){
  function setTodayIfEmpty(){
    const d=new Date(), yyyy=d.getFullYear(), mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
    const iso=`${yyyy}-${mm}-${dd}`, show=`${dd}/${mm}/${yyyy}`;
    const el=document.getElementById('ngay'); if(!el.value) el.value=iso; document.getElementById('t-ngay').textContent=show;
  }
  document.getElementById('btnParse').addEventListener('click', function(){
    const data=parseRaw(); renderTable(data); updateMeta(); document.getElementById('sheet').scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('btnClear').addEventListener('click', function(){
    document.getElementById('tbody').innerHTML=''; document.getElementById('raw').value='';
  });
  document.getElementById('btnPNG').addEventListener('click', function(){ exportPNG(3); });
  document.querySelectorAll('input[name="loaiphieu"], #ngay, #sophieu').forEach(function(el){ el.addEventListener('change', updateMeta); });
  document.getElementById('raw').addEventListener('paste', function(){ setTimeout(function(){ document.getElementById('btnParse').click(); }, 60); });
  setTodayIfEmpty(); updateMeta(); document.getElementById('year').textContent=(new Date()).getFullYear();
});
</script>
</body>
</html>
