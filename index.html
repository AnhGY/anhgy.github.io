<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />

<title>IN PHIẾU KHO - PNG Soft UI </title>
<style>
  :root{ --paper-width:100mm; --font:"Inter","Segoe UI",Tahoma,Arial,sans-serif; --fs:11pt; --line:1.35;
         --bg:#e9eef6; --card:#eef3fb; --ink:#121826; --muted:#6b7280; --brand:#2a6dff;
         --shadow1:rgba(163,177,198,.6); --shadow2:rgba(255,255,255,1); --inset1:rgba(163,177,198,.45);
         --inset2:rgba(255,255,255,.95); --border:#cfd7e6; }
  *{box-sizing:border-box} body{margin:0;font-family:var(--font);font-size:var(--fs);line-height:var(--line);
    color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%, #f5f8ff 0%, var(--bg) 50%);}
  .topbar{position:sticky;top:0;z-index:10;background:transparent}
  .topbar-inner{width:min(1100px,96vw);margin:14px auto 4px auto;padding:10px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .brand{grid-column:2;display:flex;align-items:center;gap:12px;justify-content:center;font-weight:900;letter-spacing:.3px;padding:10px 16px;border-radius:18px;background:var(--card);
         box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2)}
  .brand svg{width:28px;height:28px}.brand-title{font-size:15px}
  .top-actions{grid-column:3;justify-self:end;display:flex;gap:10px}
  .ghost{background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
         box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2);transition:transform .06s ease,box-shadow .2s ease,border-color .2s ease}
  .ghost svg{width:18px;height:18px}.ghost:hover{border-color:#b8c2d8}.ghost:active{transform:translateY(1px);
         box-shadow:inset 6px 6px 12px var(--inset1),inset -6px -6px 12px var(--inset2)}
  .wrap{width:min(1100px,96vw);margin:10px auto 24px auto;display:flex;gap:16px;align-items:flex-start;justify-content:center}
  .controls,.sheet{background:var(--card);border-radius:18px;border:1px solid var(--border);box-shadow:12px 12px 26px var(--shadow1),-12px -12px 26px var(--shadow2)}
  .controls{flex:1 1 520px;max-width:600px;padding:16px 16px 14px 16px}
  .controls h2{margin:0 0 10px 0;font-size:16px}.subtle{color:var(--muted);font-size:12px}
  .row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px} label{font-size:12px;color:#334155;display:block;margin:2px 0 4px}
  input[type="text"],input[type="date"],select,textarea{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--border);outline:none;background:var(--card);
    box-shadow:inset 6px 6px 14px var(--inset1),inset -6px -6px 14px var(--inset2);transition:box-shadow .15s,border-color .15s,background .15s}
  input:focus,select:focus,textarea:focus{border-color:#a8b6d2;box-shadow:inset 6px 6px 14px rgba(163,177,198,.55),inset -6px -6px 14px rgba(255,255,255,.98),0 0 0 4px rgba(42,109,255,.12)}
  textarea{min-height:170px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;cursor:pointer;font-weight:700;background:linear-gradient(180deg,#3C82FF,#2A6DFF);color:white;border:1px solid #2b5ee0;
       box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2);transition:transform .06s ease,box-shadow .25s ease}
  .btn svg{width:18px;height:18px;flex:0 0 18px}.btn:active{transform:translateY(1px);box-shadow:inset 6px 6px 12px rgba(0,0,0,.12),inset -6px -6px 12px rgba(255,255,255,.35)}
  .btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--border)}
  .inline-opt{display:flex;align-items:center;gap:8px}
  .inline-opt label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#334155;background:var(--card);border:1px solid var(--border);padding:8px 10px;border-radius:12px;
             box-shadow:8px 8px 18px var(--shadow1),-8px -8px 18px var(--shadow2)}
  .preview{flex:0 0 auto}.sheet{width:var(--paper-width);padding:6mm 4mm;background:white}
  .hdr{text-align:center;margin-bottom:6px}.hdr .title{font-weight:900;font-size:13.5pt;letter-spacing:.3px}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 8px;font-size:10.5pt}.meta .label{color:#475569}.meta strong{margin-left:6px}
  table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #1f2937}
  th,td{border:1px solid #1f2937;padding:4px 6px;vertical-align:middle;word-wrap:break-word;word-break:break-word} th{font-weight:800;text-align:center;background:#f5f7fb} td.center{text-align:center}
  colgroup col.col-stt{width:10%} colgroup col.col-ten{width:50%} colgroup col.col-ma{width:15%} colgroup col.col-dvt{width:10%} colgroup col.col-sl{width:15%}
  tbody tr:nth-child(odd){background:#fbfcff} tbody tr:hover{background:#eef2ff} .footer-note{margin-top:10px;font-size:11px;color:var(--muted);text-align:center}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:all .25s ease;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;z-index:9999}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:900px){.wrap{flex-direction:column;align-items:center}.controls{width:100%;max-width:720px}.preview{order:2}}
  @media print{.topbar,.controls,.footer-note,#toast{display:none!important}.sheet{border:none;margin:0 auto;width:var(--paper-width);padding:4mm;box-shadow:none;background:white}
           @page{size:100mm auto;margin:4mm}}
</style>
</head>
<body>

<script>
/* ===== Helpers ===== */
function showToast(msg){
  var t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._timer); showToast._timer=setTimeout(function(){t.classList.remove('show')}, 1600);
}

/* ===== Dấu tách & Parse ===== */
function pickDelimiterAuto(text){
  var samples=text.trim().split(/\r?\n/).slice(0,20), SEP={tab:/\t/,semicolon:/;/,comma:/,/,spaces:/\s{2,}/};
  var best='tab',score=-1; 
  for(var name in SEP){
    var rx=SEP[name], s=0; 
    for(var i=0;i<samples.length;i++){ 
      var parts=samples[i].split(rx).filter(function(x){return x.trim()!=='';}); 
      if(parts.length>=4)s+=parts.length;
    } 
    if(s>score){score=s;best=name;}
  }
  return best;
}
function splitLine(line,mode){
  var p; 
  if(mode==='tab')p=line.split(/\t/);
  else if(mode==='semicolon')p=line.split(/;/);
  else if(mode==='comma')p=line.split(/,/);
  else if(mode==='spaces')p=line.split(/\s{2,}/);
  else p=line.split(/\t/);
  return p.map(function(s){return s.trim();}).filter(function(x){return x;});
}
function looksLikeHeaderRow(parts){
  var j=parts.join(' ').toUpperCase();
  if(/^(A\s+B\s+C\s+D(\s+1)?)$/.test(j))return true;
  if(parts.length<=2 && ['A','B','C','D','1','STT'].indexOf(j)>=0)return true;
  return false;
}
function cleanQuantity(v){
  var t=(v||'').trim(); if(t==='')return'';
  if(/^(\d+)\.000$/.test(t))return t.replace(/^(\d+)\.000$/,'$1');
  if(/^\d{1,3}(\.\d{3})+$/.test(t))return t.replace(/\./g,'');
  if(/^\d{1,3}(,\d{3})+$/.test(t))return t.replace(/,/g,'');
  return t;
}
function parseRaw(){
  var raw=document.getElementById('raw').value; if(!raw.trim()){alert('Hãy dán dữ liệu trước.'); return[];}
  var mode=document.getElementById('delimiter').value; if(mode==='auto')mode=pickDelimiterAuto(raw) || 'tab';
  var lines=raw.split(/\r?\n/), rows=[];
  for(var i=0;i<lines.length;i++){
    var parts=splitLine(lines[i],mode);
    if(parts.length===0)continue; 
    if(looksLikeHeaderRow(parts))continue; 
    rows.push(parts);
  }
  var out=[], sttCounter=1;
  for(var k=0;k<rows.length;k++){
    var tokens=rows[k].slice(); // clone
    var nonEmpty=tokens.filter(function(t){return t.trim()!==''});
    if(nonEmpty.length<2)continue;
    var stt=/^\d+$/.test(nonEmpty[0])?nonEmpty.shift():String(sttCounter);
    var ten=nonEmpty.shift()||'';
    var ma=nonEmpty.shift()||'';
    var dvt=nonEmpty.shift()||'';
    var sl=nonEmpty.shift()||'';
    if(sl==='' && /^\d{1,3}([.,]\d{3})*(\.\d+)?$/.test(dvt)){sl=dvt; dvt='';}
    sl=cleanQuantity(sl);
    out.push({stt:stt, ten:ten, ma:ma, dvt:dvt, sl:sl});
    sttCounter++;
  }
  return out;
}
function renderTable(data){
  var tbody=document.getElementById('tbody'); tbody.innerHTML='';
  data.forEach(function(row){
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td class="center">'+row.stt+'</td>'+
      '<td contenteditable="true">'+row.ten+'</td>'+
      '<td contenteditable="true" style="word-break:break-word">'+row.ma+'</td>'+
      '<td contenteditable="true" class="center">'+row.dvt+'</td>'+
      '<td contenteditable="true" class="center">'+row.sl+'</td>';
    tbody.appendChild(tr);
  });
}
function updateMeta(){
  var loaiphieu=document.querySelector('input[name="loaiphieu"]:checked').value;
  document.getElementById('t-loaiphieu').textContent=(loaiphieu||'').toUpperCase();
  var ngay=document.getElementById('ngay').value;
  if(ngay){ var p=ngay.split('-'); document.getElementById('t-ngay').textContent=p[2]+'/'+p[1]+'/'+p[0]; }
  document.getElementById('t-sophieu').textContent=document.getElementById('sophieu').value||'';
}

/* ===== Wrap thông minh (ưu tiên -, /, _, khoảng trắng; fallback cắt cứng) ===== */
function wrapTextSmart(ctx, text, maxWidth){
  text = (text||'').trim();
  if (!text) return [''];
  var tokens = [];
  text.split(/(\-|\/|_|\s+)/).forEach(function(tok){
    if(tok===undefined || tok==='') return;
    tokens.push(tok);
  });
  var lines=[], line='';
  function widthOf(s){ return ctx.measureText(s).width; }
  for (var i=0;i<tokens.length;i++){
    var t = tokens[i];
    var trial = line + t;
    if (widthOf(trial) <= maxWidth){
      line = trial;
    } else {
      if (line.trim()!=='') { lines.push(line.trim()); line = ''; }
      if (widthOf(t) > maxWidth){
        var chunk='';
        for (var j=0;j<t.length;j++){
          var tryChar = chunk + t[j];
          if (widthOf(tryChar) <= maxWidth) { chunk = tryChar; }
          else { lines.push(chunk); chunk = t[j]; }
        }
        line = chunk;
      } else {
        line = t;
      }
    }
  }
  if (line.trim()!=='') lines.push(line.trim());
  return lines;
}

/* ===== Vẽ PNG + copy clipboard; checkbox chỉ điều khiển tải ảnh ===== */
function mmToPx(mm, dpi){ dpi=dpi||96; return Math.round(mm * dpi / 25.4); }
async function exportPNG(scale){
  scale = scale || 3;
  var wantSave=document.getElementById('optSave').checked;
  var baseW=mmToPx(100,96), contentW=baseW*scale;
  var outer=12*scale, cardPad=10*scale, radiusCard=16*scale, radiusSheet=12*scale;
  var padLeft=10*scale, padRight=10*scale, padTop=10*scale, padBottom=10*scale;
  var lineW=Math.max(1,Math.floor(scale));

  var title=document.getElementById('t-loaiphieu').textContent||'PHIẾU KHO';
  var ngay=document.getElementById('t-ngay').textContent||'';
  var sophieu=document.getElementById('t-sophieu').textContent||'';
  var rows=[]; document.querySelectorAll('#tbody tr').forEach(function(tr){
    var t=tr.querySelectorAll('td');
    rows.push([t[0]?t[0].textContent.trim():'', t[1]?t[1].textContent.trim():'', t[2]?t[2].textContent.trim():'', t[3]?t[3].textContent.trim():'', t[4]?t[4].textContent.trim():'']);
  });

  var testCanvas=document.createElement('canvas'), tctx=testCanvas.getContext('2d');
  tctx.font=(12*scale)+'px Arial, sans-serif';
  var colPerc=[.10,.50,.15,.10,.15];
  var Wdraw = contentW - padLeft - padRight;
  var colX=[padLeft]; for(var i=0;i<5;i++){ colX.push(colX[i] + Math.floor(Wdraw*colPerc[i])); }
  var headerH=18*scale, metaH=16*scale, gap=6*scale, thH=24*scale, rowPadY=6*scale, lineH=14*scale;
  var maxTenWidth=colX[2]-colX[1]-8*scale, maxMaWidth=colX[3]-colX[2]-8*scale;

  var contentH = padTop + headerH + gap + metaH + gap + thH;
  var rowHeights=[];
  rows.forEach(function(r){
    var tenLines=wrapTextSmart(tctx,r[1],maxTenWidth);
    var maLines=wrapTextSmart(tctx,r[2],maxMaWidth);
    var n=Math.max(1,tenLines.length, maLines.length);
    var h=rowPadY*2+n*lineH; rowHeights.push(h); contentH += h;
  });
  contentH += padBottom;

  var W = contentW + (outer + cardPad)*2;
  var H = contentH + (outer + cardPad)*2;

  var canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H; var c=canvas.getContext('2d');

  var grd=c.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#f7f9ff'); grd.addColorStop(1,'#eaf1ff');
  c.fillStyle=grd; c.fillRect(0,0,W,H);

  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  var cardX=outer, cardY=outer, cardW=W-outer*2, cardH=H-outer*2;
  c.shadowColor='rgba(0,0,0,.18)'; c.shadowBlur=18*scale; c.shadowOffsetY=8*scale;
  c.fillStyle='#eef3fb'; roundRect(c,cardX,cardY,cardW,cardH,radiusCard); c.fill();
  c.shadowColor='transparent';

  var sheetX=cardX+cardPad, sheetY=cardY+cardPad, sheetW=contentW, sheetH=contentH;
  c.fillStyle='#ffffff'; roundRect(c,sheetX,sheetY,sheetW,sheetH,radiusSheet); c.fill();
  c.strokeStyle='#d4dae7'; c.lineWidth=1*scale; roundRect(c,sheetX+0.5,sheetY+0.5,sheetW-1,sheetH-1,radiusSheet); c.stroke();

  var ox=sheetX, oy=sheetY;

  c.strokeStyle='#000000'; c.lineWidth=lineW; c.fillStyle='#000000';
  c.save(); c.translate(0.5,0.5);

  c.font=(14*scale)+'px Arial, sans-serif'; c.textAlign='center'; c.textBaseline='top';
  c.fillText(title, ox + contentW/2, oy + padTop);
  c.font=(12*scale)+'px Arial, sans-serif'; c.textAlign='left'; 
  c.fillText('Ngày: '+ngay, ox + padLeft, oy + padTop + headerH + gap);
  c.textAlign='right'; 
  c.fillText('Số phiếu: '+sophieu, ox + contentW - padRight, oy + padTop + headerH + gap);

  var ty = oy + padTop + headerH + gap + metaH + gap;
  c.fillStyle='#f1f5f9'; c.fillRect(Math.floor(ox + padLeft), Math.floor(ty), Math.floor(Wdraw), Math.floor(thH));
  c.fillStyle='#000000'; c.textAlign='center'; c.textBaseline='middle';
  var ths=['STT','Tên hàng','Mã','ĐVT','SL'];
  for(i=0;i<5;i++){ var x0=Math.floor(ox + colX[i]), x1=Math.floor(ox + colX[i+1]); c.strokeRect(x0, Math.floor(ty), x1-x0, Math.floor(thH)); c.fillText(ths[i], Math.floor((x0+x1)/2), Math.floor(ty + thH/2)); }
  ty += thH; c.textBaseline='top';

  rows.forEach(function(r,idx){
    var rh=rowHeights[idx];
    for(i=0;i<5;i++){ var x0=Math.floor(ox + colX[i]), x1=Math.floor(ox + colX[i+1]); c.strokeRect(x0, Math.floor(ty), x1-x0, Math.floor(rh)); }
    c.textAlign='center'; c.font=(12*scale)+'px Arial, sans-serif'; 
    c.fillText(r[0], Math.floor(ox + (colX[0]+colX[1])/2), Math.floor(ty + (rh - lineH)/2));

    // Tên hàng
    c.textAlign='left'; 
    var tenLines=wrapTextSmart(c, r[1], maxTenWidth); 
    var yText = ty + rowPadY; 
    tenLines.forEach(function(line){ c.fillText(line, Math.floor(ox + colX[1] + 4*scale), Math.floor(yText)); yText += lineH; });

    // Mã
    var maLines=wrapTextSmart(c, r[2], maxMaWidth);
    yText = ty + rowPadY;
    maLines.forEach(function(line){ c.fillText(line, Math.floor(ox + colX[2] + 4*scale), Math.floor(yText)); yText += lineH; });

    // ĐVT + SL
    c.textAlign='center'; 
    c.fillText(r[3], Math.floor(ox + (colX[3]+colX[4])/2), Math.floor(ty + (rh - lineH)/2));
    c.fillText(r[4], Math.floor(ox + (colX[4]+colX[5])/2), Math.floor(ty + (rh - lineH)/2));
    ty += rh;
  });
  c.restore();

  var blob = await new Promise(function(res){canvas.toBlob(res, 'image/png');});
  if(!blob){ alert('Không thể xuất PNG.'); return; }
  var ts=new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  if(wantSave){
    var a=document.createElement('a'); a.download='PhieuKho_'+ts+'.png'; a.href=URL.createObjectURL(blob); a.click();
  }
  try{
    if (navigator.clipboard && window.ClipboardItem) {
      var item = new ClipboardItem({ "image/png": blob });
      await navigator.clipboard.write([item]);
      showToast('✅ Đã sao chép'+(wantSave?' & tải ':' ')+'ảnh');
    } else {
      showToast((wantSave?'✅ Đã tải ảnh • ':'')+'Trình duyệt không hỗ trợ copy ảnh');
    }
  }catch(e){
    showToast((wantSave?'✅ Đã tải ảnh • ':'')+'Không thể copy ảnh (trình duyệt chặn)');
  }
}

/* ===== Khởi tạo & sự kiện ===== */
document.addEventListener('DOMContentLoaded', function(){
  function setTodayIfEmpty(){
    var d=new Date(), yyyy=d.getFullYear(), mm=('0'+(d.getMonth()+1)).slice(-2), dd=('0'+d.getDate()).slice(-2);
    var iso=yyyy+'-'+mm+'-'+dd, show=dd+'/'+mm+'/'+yyyy;
    var el=document.getElementById('ngay'); if(!el.value) el.value=iso; document.getElementById('t-ngay').textContent=show;
  }
  document.getElementById('btnParse').addEventListener('click', function(){
    var data=parseRaw(); renderTable(data); updateMeta(); document.getElementById('sheet').scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('btnClear').addEventListener('click', function(){
    document.getElementById('tbody').innerHTML=''; document.getElementById('raw').value='';
  });
  document.getElementById('btnPNG').addEventListener('click', function(){ exportPNG(3); });
  Array.prototype.slice.call(document.querySelectorAll('input[name="loaiphieu"], #ngay, #sophieu')).forEach(function(el){ el.addEventListener('change', updateMeta); });
  document.getElementById('raw').addEventListener('paste', function(){ setTimeout(function(){ document.getElementById('btnParse').click(); }, 60); });
  setTodayIfEmpty(); updateMeta(); document.getElementById('year').textContent=(new Date()).getFullYear();
});
</script>
